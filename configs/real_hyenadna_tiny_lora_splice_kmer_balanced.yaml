seed: 42
device: cuda
gpu_id: 3
output_dir: outputs
results_dir: results
task:
  name: splice_sites_all
  num_labels: 3
data:
  dataset_type: genomic
  seq_length: 512
  num_workers: 0
  sequence_column: sequence
  label_column: label
  id_column: id
  metadata_column: metadata
  tokenizer_mode: raw
  splits:
    train: data/benchmarks/splice_sites_all_kmer_balanced/train.csv
    val: data/benchmarks/splice_sites_all_kmer_balanced/val.csv
    test: data/benchmarks/splice_sites_all_kmer_balanced/test.csv
model:
  backbone_type: hf
  pretrained_model_name_or_path: local_assets/hyenadna_tiny_1k_hf
  tokenizer_name_or_path: local_assets/hyenadna_tiny_1k_hf
  cache_dir: null
  trust_remote_code: true
  classifier_dropout: 0.1
adapter:
  name: baseline_lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - encoder.backbone.layers.0.mixer.out_proj
    - encoder.backbone.layers.1.mixer.out_proj
    - classifier
optim:
  lr: 0.0003
  weight_decay: 0.01
scheduler:
  name: none
train:
  epochs: 4
  batch_size: 4
  checkpoint_every: 1
  log_every: 100
  checkpoint_monitor: accuracy
  checkpoint_mode: max
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0
debug:
  train_size: 32
  val_size: 16
  test_size: 16
  batch_size: 2
  epochs: 1
  max_steps: 4
  output_subdir: debug_hyenadna_tiny_lora_splice_kmer_balanced
logging:
  save_predictions: true
