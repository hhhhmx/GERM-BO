seed: 42
device: cuda
gpu_id: 3
output_dir: outputs
results_dir: results
task:
  name: genomic_sequence_classification
  num_labels: 2
data:
  dataset_type: genomic
  seq_length: 512
  num_workers: 0
  sequence_column: sequence
  label_column: label
  id_column: id
  metadata_column: metadata
  tokenizer_mode: raw
  splits:
    train: data/splits/train.csv
    val: data/splits/val.csv
    test: data/splits/test.csv
model:
  backbone_type: hf
  pretrained_model_name_or_path: zhihan1996/DNABERT-2-117M
  tokenizer_name_or_path: zhihan1996/DNABERT-2-117M
  cache_dir: null
  trust_remote_code: false
  classifier_dropout: 0.1
adapter:
  name: baseline_lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - classifier
optim:
  lr: 0.0005
  weight_decay: 0.01
scheduler:
  name: none
train:
  epochs: 3
  batch_size: 4
  checkpoint_every: 1
  log_every: 10
debug:
  train_size: 32
  val_size: 16
  test_size: 16
  batch_size: 2
  epochs: 1
  max_steps: 4
  output_subdir: debug_real_baseline
logging:
  save_predictions: true
