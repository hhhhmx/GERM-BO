seed: 42
device: cuda
gpu_id: 3
output_dir: outputs
results_dir: results
task:
  name: genomic_sequence_classification
  num_labels: 2
data:
  dataset_type: genomic
  seq_length: 128
  num_workers: 0
  sequence_column: sequence
  label_column: label
  id_column: id
  metadata_column: metadata
  tokenizer_mode: char_space
  splits:
    train: data/splits/train.csv
    val: data/splits/val.csv
    test: data/splits/test.csv
model:
  backbone_type: hf
  pretrained_model_name_or_path: local_assets/hf_smoke_backbone
  tokenizer_name_or_path: local_assets/hf_smoke_backbone
  cache_dir: null
  trust_remote_code: false
  classifier_dropout: 0.1
adapter:
  name: baseline_lora
  rank: 4
  alpha: 8
  dropout: 0.05
  target_modules:
    - encoder.encoder.layer.0.attention.self.query
    - encoder.encoder.layer.0.attention.self.value
    - encoder.encoder.layer.1.attention.self.query
    - encoder.encoder.layer.1.attention.self.value
    - classifier
optim:
  lr: 0.001
  weight_decay: 0.0
scheduler:
  name: none
train:
  epochs: 3
  batch_size: 2
  checkpoint_every: 1
  log_every: 2
debug:
  train_size: 4
  val_size: 2
  test_size: 2
  batch_size: 2
  epochs: 1
  max_steps: 2
  output_subdir: debug_real_hf_smoke_baseline_pilot
logging:
  save_predictions: true
