seed: 42
device: cuda
gpu_id: 3
output_dir: outputs
results_dir: results
task:
  name: mock_sequence_classification
  num_labels: 2
data:
  dataset_type: mock
  train_size: 256
  val_size: 64
  test_size: 64
  seq_length: 32
  num_workers: 0
  sequence_column: sequence
  label_column: label
  id_column: id
  metadata_column: metadata
  tokenizer_mode: raw
  splits:
    train: data/splits/train.csv
    val: data/splits/val.csv
    test: data/splits/test.csv
model:
  backbone_type: mock
  vocab_size: 4
  hidden_dim: 64
  num_layers: 2
  pretrained_model_name_or_path: null
  tokenizer_name_or_path: null
  cache_dir: null
  trust_remote_code: false
  classifier_dropout: 0.1
adapter:
  name: none
  rank: 4
  alpha: 8
  dropout: 0.0
  target_modules:
    - classifier
  compensation_strength: 0.5
  border_score_type: normalized_border_length
  border_normalization: mean
optim:
  lr: 0.001
  weight_decay: 0.0
scheduler:
  name: none
train:
  epochs: 3
  batch_size: 16
  checkpoint_every: 1
  log_every: 5
debug:
  train_size: 32
  val_size: 16
  test_size: 16
  batch_size: 8
  epochs: 1
  max_steps: 4
  output_subdir: debug
logging:
  save_predictions: true
