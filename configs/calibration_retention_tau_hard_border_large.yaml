seed: 42
device: cuda
gpu_id: 3
output_dir: outputs
results_dir: results
task:
  name: genomic_sequence_classification
  num_labels: 2
data:
  dataset_type: genomic
  seq_length: 128
  num_workers: 0
  sequence_column: sequence
  label_column: label
  id_column: id
  metadata_column: metadata
  tokenizer_mode: raw
  splits:
    train: data/splits_hard_border_large/train.csv
    val: data/splits_hard_border_large/val.csv
    test: data/splits_hard_border_large/test.csv
model:
  backbone_type: hf
  pretrained_model_name_or_path: local_assets/dnabert2_117m
  tokenizer_name_or_path: local_assets/dnabert2_117m
  cache_dir: null
  trust_remote_code: true
  attention_probs_dropout_prob: 0.1
  classifier_dropout: 0.1
adapter:
  name: none
optim:
  lr: 0.0003
  weight_decay: 0.01
scheduler:
  name: none
train:
  epochs: 1
  batch_size: 8
debug:
  train_size: 64
  val_size: 16
  test_size: 16
  batch_size: 4
  epochs: 1
  max_steps: 4
  output_subdir: debug_retention_tau_calibration_hard_border_large
logging:
  save_predictions: false
